[build]
  publish = "public"
  functions = "netlify/functions"

# No build step: the frontend is one static file and the functions are plain
# ESM that Netlify bundles itself.
[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
